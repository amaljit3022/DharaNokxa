name: dharanokxa

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DHARANOKXA_ALLOWED_ORIGINS: http://127.0.0.1:${DHARANOKXA_WEB_PORT:-3417},http://localhost:${DHARANOKXA_WEB_PORT:-3417}
    ports:
      - "127.0.0.1:${DHARANOKXA_API_PORT:-8417}:8000"
    volumes:
      - dharanokxa-results:/app/results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${DHARANOKXA_API_PORT:-8417}
    ports:
      - "127.0.0.1:${DHARANOKXA_WEB_PORT:-3417}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  dharanokxa-results:
