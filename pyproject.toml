[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dharanokxa"
version = "0.1.0"
description = "Automated GIS-to-hydraulic water distribution network design using WNTR and EPANET."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  "pandas>=2.2",
  "geopandas>=1.0",
  "shapely>=2.0",
  "fiona>=1.9",
  "pyproj>=3.6",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "wntr>=1.3",
  "numpy>=1.26",
  "pyogrio>=0.8",
  "openpyxl>=3.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.28"
]

[project.scripts]
dharanokxa = "dharanokxa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
